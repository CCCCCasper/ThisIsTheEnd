<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Dashboard</title>

    <link rel="stylesheet" href="{{ url_for('styles', filename='clients.css') }}">
</head>
<body>
    {% if session.get('role') == 'admin' or session.get('role') == 'employee' %}

    <div class="dashboard-container">
        <button class="back-btn" onclick="window.history.back(); return false;">&larr; Back</button>

        <h2>All Clients</h2>


        <table class="dashboard-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                </tr>
            </thead>
            <tbody>
                {% for client in clients %}
                        <tr>
                            <td>{{ client.username }}</td>
                            <td>{{ client.email }}</td>
                        </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    {% else %}
        <script>
            window.location.href = "{{ url_for('index') }}";
        </script>
    {% endif %}
</body>
</html>
