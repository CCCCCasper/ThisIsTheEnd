<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Create Account</title>
	<link rel="stylesheet" href="{{ url_for('styles', filename='index.css') }}">
	<style>
		body{font-family:Segoe UI,Arial,Helvetica,sans-serif;padding:24px}
		form{max-width:420px}
		input{display:block;margin:8px 0;padding:8px;width:100%}
		button{padding:8px 12px}
		p.message{color:#b00}
	</style>
</head>
<body>
	<h1>Create Account</h1>
	<form id="createForm" action="{{ url_for('register') }}" method="post">
		<label for="create-username">Username</label>
		<input id="create-username" name="username" type="text" required>

		<label for="create-display">Display name (optional)</label>
		<input id="create-display" name="display_name" type="text">

		<label for="create-password">Password</label>
		<input id="create-password" name="password" type="password" required>

		<label for="create-password-confirm">Confirm Password</label>
		<input id="create-password-confirm" name="password_confirm" type="password" required>

		<button type="submit">Create Account</button>
	</form>

	{% with messages = get_flashed_messages() %}
		{% if messages %}
			<p class="message">{{ messages[0] }}</p>
		{% endif %}
	{% endwith %}

	<p>Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>

</body>
</html>
