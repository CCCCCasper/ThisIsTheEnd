<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <link rel="stylesheet" href="{{ url_for('styles', filename='index.css') }}">
</head>
<body>
  {% if session.get('user_id') %}

  <div class="center"><h1>Welcome, {{ session.get('display_name') or session.get('username') }}!</h1></div>

    {% if session.get('role') == 'admin' %}

        <a class="box" href="{{ url_for('admin_dashboard') }}">
          <h2>Go to Admin Dashboard</h2>
        </a>

    {% endif %}
  {% else %}

    <script>
      window.location.href = "{{ url_for('login') }}";
    </script>

  {% endif %}

  <a class="box" href="{{ url_for('reservering') }}">
    <h2>Maak een reservering</h2>
  </a>
  <!-- <a class="box" href="{{ url_for('') }}">
    <h2></h2>
  </a>
  <a class="box" href="{{ url_for('') }}">
    <h2></h2>
  </a> -->


 <form action="{{ url_for('logout') }}" method="post">
    <div class="center">
      <button type="submit">Logout</button>
    </div>
  </form>




</body>
</html>
