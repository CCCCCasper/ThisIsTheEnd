<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Register Account</title>
	<link rel="stylesheet" href="{{ url_for('styles', filename='account.css') }}">

</head>
<body>
	<div class="login-container">
		
		<h1><div class="center">Register Account</div></h1>
		<form id="registerForm" action="{{ url_for('register') }}" method="post">
			<label for="register-username">Username</label>
			<input id="register-username" name="username" type="text" required>

			<label for="register-email">Email</label>
			<input id="register-email" name="email" type="email" required>

			<label for="register-password">Password</label>
			<input id="register-password" name="password" type="password" required>

			<label for="register-password-confirm">Confirm Password</label>
			<input id="register-password-confirm" name="password_confirm" type="password" required>

			<button type="submit">Create Account</button>
		</form>
		<div class="center">
			{% with messages = get_flashed_messages() %}
				{% if messages %}
					<p class="message">{{ messages[0] }}</p>
				{% endif %}
			{% endwith %}

			<p>Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
		</div>
	</div>
</body>
</html>
