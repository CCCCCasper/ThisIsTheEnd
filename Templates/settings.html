<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account Settings</title>
    <link rel="stylesheet" href="{{ url_for('styles', filename='settings.css') }}">
</head>
<body>
    <div class="settings-container">
        <button class="back-btn" onclick="window.history.back(); return false;">&larr; Back</button>
        <h2>Account Settings</h2>
        <form method="post" action="{{ url_for('edit_account') }}">
            <label for="username">Change Username</label>
            <input type="text" id="username" name="username" value="{{ user.username }}" required>
            <label for="email">Change Email</label>
            <input type="email" id="email" name="email" value="{{ user.email }}" required>
            <label for="password">New Password</label>
            <input type="password" id="password" name="password" placeholder="Leave blank to keep current">
            <button type="submit" class="save">Save</button>
        </form>
        <form method="post" action="{{ url_for('logout') }}">
            <button type="submit" class="logout">Log Out</button>
        </form>
        <form method="post" action="{{ url_for('delete_account') }}" onsubmit="return confirm('Are you sure you want to delete your account? This cannot be undone.');">
            <button type="submit" class="danger">Delete Account</button>
        </form>
    </div>
</body>
</html>
